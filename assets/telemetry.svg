<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="GitHub public profile telemetry">
<style>@keyframes beacon{0%,100%{opacity:.3}50%{opacity:1}} .beacon{animation:beacon 2.2s ease-in-out infinite} @keyframes signal{0%,100%{opacity:.4}50%{opacity:1}} .signal{animation:signal 3.4s ease-in-out infinite}</style>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#080f21"/><stop offset=".68" stop-color="#10203a"/><stop offset="1" stop-color="#1e1a43"/></linearGradient>
<linearGradient id="line"><stop stop-color="#4ad9ef"/><stop offset="1" stop-color="#b39aff"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect x="1" y="1" width="1198" height="158" rx="15" fill="url(#bg)" stroke="#344969"/>
<rect x="24" y="20" width="4" height="23" rx="2" fill="#50d8ec"/>
<text x="42" y="37" fill="#cbf6ff" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="14" font-weight="700">MISSION TELEMETRY</text>
<text x="1170" y="36" fill="#8fb4ce" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="500" text-anchor="end">GITHUB / PUBLIC</text>
<line x1="28" y1="56" x2="1172" y2="56" stroke="#304862"/>
<text x="30" y="84" fill="#89b4d0" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="500">PUBLIC REPOSITORIES</text>
<text x="30" y="121" fill="#f1f7ff" font-family="'DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="700">48</text>
<line x1="273" y1="75" x2="273" y2="131" stroke="#34516e"/>
<text x="290" y="84" fill="#89b4d0" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="500">FOLLOWERS</text>
<text x="290" y="121" fill="#f1f7ff" font-family="'DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="700">9</text>
<line x1="503" y1="75" x2="503" y2="131" stroke="#34516e"/>
<text x="520" y="84" fill="#89b4d0" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="500">STARS RECEIVED</text>
<text x="520" y="121" fill="#f1f7ff" font-family="'DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="700">6</text>
<line x1="753" y1="75" x2="753" y2="131" stroke="#34516e"/>
<text x="770" y="84" fill="#89b4d0" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="12" font-weight="500">RECENTLY UPDATED</text>
<text x="770" y="121" fill="#f1f7ff" font-family="'DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="700">ayush-khatrii</text>
<rect class="signal" x="30" y="145" width="1140" height="2" rx="1" fill="url(#line)" opacity="0.75"/>
<circle class="beacon" cx="1015" cy="30" r="3.5" fill="#65f4c8"/>
</svg>
